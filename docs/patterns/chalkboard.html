<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; width: 1600px; height: 900px; overflow: hidden; }
  body {
    background:
      radial-gradient(130% 100% at 20% 8%, rgba(255,255,255,.06), transparent 58%),
      linear-gradient(165deg, #24322c 0%, #1a2622 48%, #131c19 100%);
  }
  /* chalk dust + eraser smear, the thing that makes slate read as slate */
  .grit {
    position: absolute; inset: 0; pointer-events: none; z-index: 3; opacity: .22;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }
  .smear {
    position: absolute; inset: 0; pointer-events: none; z-index: 2; opacity: .5;
    background:
      radial-gradient(38% 16% at 28% 62%, rgba(255,255,255,.05), transparent 70%),
      radial-gradient(30% 12% at 74% 30%, rgba(255,255,255,.04), transparent 70%),
      repeating-linear-gradient(97deg, rgba(255,255,255,.014) 0 2px, transparent 2px 17px);
  }
  svg { position: absolute; inset: 0; z-index: 1; }
  text { font-family: "Caveat", cursive; fill: #f4f1e8; }
</style>
</head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Roughen every stroke so nothing looks like a vector. This is what makes
         it read as drawn rather than rendered. -->
    <filter id="chalk" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="chalkSoft" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- chalk bloom: dry pigment scatters a little light -->
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="tip" viewBox="0 0 12 12" refX="9" refY="6"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#dfe6dc" stroke-width="2.1"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="tipMint" viewBox="0 0 12 12" refX="9" refY="6"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#8fe3ad" stroke-width="2.1"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ── title ────────────────────────────────────────────────────────────── -->
  <g filter="url(#bloom)">
    <text x="72" y="96" font-size="62" font-weight="700">the shape of an agentic pipeline</text>
  </g>
  <text x="74" y="136" font-size="27" fill="#a9b6ac">every stage a different pattern — picked for the job, not the buzzword</text>
  <path d="M72 158 C 420 152, 900 164, 1360 155" stroke="#f4f1e8" stroke-width="3.4"
        fill="none" opacity=".55" stroke-linecap="round" filter="url(#chalk)"/>

  <!-- ── the graph ────────────────────────────────────────────────────────── -->
  <g filter="url(#chalk)" fill="none" stroke-linecap="round">

    <!-- 1 · scorer -->
    <rect x="96" y="286" width="252" height="150" rx="16" stroke="#9ed6ee" stroke-width="3.6"/>
    <!-- 2 · tailor ⇄ critic, drawn as one box because it IS one loop -->
    <rect x="516" y="286" width="300" height="150" rx="16" stroke="#f5cf80" stroke-width="3.6"/>
    <!-- the reflection loop, arcing back over itself -->
    <path d="M576 286 C 566 208, 766 208, 756 286" stroke="#f5cf80" stroke-width="3.2"
          marker-end="url(#tip)" opacity=".95"/>
    <!-- 3 · applier -->
    <rect x="984" y="286" width="268" height="150" rx="16" stroke="#f3a99d" stroke-width="3.6"/>
    <!-- done -->
    <circle cx="1452" cy="361" r="60" stroke="#8fe3ad" stroke-width="3.6"/>

    <!-- edges -->
    <path d="M356 361 L 508 361" stroke="#dfe6dc" stroke-width="3.2" marker-end="url(#tip)"/>
    <path d="M824 361 L 976 361" stroke="#dfe6dc" stroke-width="3.2" marker-end="url(#tip)"/>
    <path d="M1260 361 L 1384 361" stroke="#8fe3ad" stroke-width="3.2" marker-end="url(#tipMint)"/>

    <!-- the branch that matters: when it cannot, it climbs -->
    <path d="M1118 444 L 1118 566" stroke="#f3a99d" stroke-width="3" marker-end="url(#tip)" opacity=".9"/>
  </g>

  <!-- node labels -->
  <text x="222" y="352" font-size="42" font-weight="700" fill="#9ed6ee" text-anchor="middle">scorer</text>
  <text x="222" y="392" font-size="23" fill="#93a297" text-anchor="middle">is this worth my time?</text>

  <text x="666" y="352" font-size="42" font-weight="700" fill="#f5cf80" text-anchor="middle">tailor ⇄ critic</text>
  <text x="666" y="392" font-size="23" fill="#93a297" text-anchor="middle">rewrite until it's good</text>
  <text x="666" y="228" font-size="24" fill="#f5cf80" text-anchor="middle">max 2 rounds</text>

  <text x="1118" y="352" font-size="42" font-weight="700" fill="#f3a99d" text-anchor="middle">applier</text>
  <text x="1118" y="392" font-size="23" fill="#93a297" text-anchor="middle">fill it · send it</text>

  <text x="1452" y="352" font-size="34" font-weight="700" fill="#8fe3ad" text-anchor="middle">applied</text>
  <text x="1452" y="384" font-size="21" fill="#93a297" text-anchor="middle">confirmed</text>

  <!-- pattern names, small caps under each node -->
  <text x="222" y="470" font-size="21" fill="#9ed6ee" text-anchor="middle" letter-spacing="2">STRUCTURED OUTPUT</text>
  <text x="666" y="470" font-size="21" fill="#f5cf80" text-anchor="middle" letter-spacing="2">REFLECTION LOOP</text>
  <text x="1118" y="470" font-size="21" fill="#f3a99d" text-anchor="middle" letter-spacing="2">AGENT AS A TOOL</text>

  <!-- ── the escalation ladder ────────────────────────────────────────────── -->
  <text x="96" y="596" font-size="30" font-weight="700" fill="#f4f1e8">when the form wins, it climbs — never the other way round</text>

  <g filter="url(#chalkSoft)" fill="none" stroke-linecap="round">
    <path d="M96 622 C 420 616, 900 628, 1330 620" stroke="#f4f1e8" stroke-width="2.4" opacity=".3"/>
  </g>

  <g font-size="30" font-weight="700">
    <text x="96"  y="690" fill="#9ed6ee">plain code</text>
    <text x="96"  y="726" font-size="22" font-weight="600" fill="#93a297">reads the form, types your answers. no model at all.</text>

    <text x="640" y="690" fill="#f5cf80">vision agent</text>
    <text x="640" y="726" font-size="22" font-weight="600" fill="#93a297">only when the page can't be parsed.</text>

    <text x="1118" y="690" fill="#8fe3ad">you</text>
    <text x="1118" y="726" font-size="22" font-weight="600" fill="#93a297">the security check. that's it.</text>
  </g>

  <g filter="url(#chalkSoft)" fill="none" stroke-linecap="round">
    <path d="M560 678 L 618 678" stroke="#93a297" stroke-width="2.6" marker-end="url(#tip)"/>
    <path d="M1030 678 L 1092 678" stroke="#93a297" stroke-width="2.6" marker-end="url(#tip)"/>
  </g>

  <!-- ── the line worth arguing about ─────────────────────────────────────── -->
  <g filter="url(#chalkSoft)" fill="none">
    <path d="M92 782 L 92 852" stroke="#8fe3ad" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="120" y="812" font-size="31" font-weight="700" fill="#f4f1e8">the model is the fallback, not the default</text>
  <text x="120" y="848" font-size="23" fill="#93a297">it never solves a CAPTCHA, never makes an account, never re-sends a submit it can't confirm</text>

  <text x="1520" y="852" font-size="24" fill="#7d8a80" text-anchor="end">AppliedIn · runs on your machine</text>
</svg>

<div class="smear"></div>
<div class="grit"></div>
</body>
</html>
