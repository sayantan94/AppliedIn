[project]
name = "appliedin-whatsapp"
version = "0.1.0"
description = "Meta WhatsApp Cloud API bot: webhook, command router, read-only Q&A agent"
requires-python = ">=3.12"
dependencies = [
    "appliedin-core",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appliedin_whatsapp"]
