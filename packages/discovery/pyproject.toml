[project]
name = "appliedin-discovery"
version = "0.1.0"
description = "ATS feed adapters + discovery Lambda for AppliedIn"
requires-python = ">=3.12"
dependencies = [
    "appliedin-core",
    "httpx>=0.27",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appliedin_discovery"]
