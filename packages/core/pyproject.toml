[project]
name = "appliedin-core"
version = "0.1.0"
description = "Shared domain models, storage clients, and LLM provider for AppliedIn"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appliedin_core"]
