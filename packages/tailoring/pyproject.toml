[project]
name = "appliedin-tailoring"
version = "0.1.0"
description = "Stage-2 scoring, tailoring agent, truthfulness validator, and Typst render for AppliedIn"
requires-python = ">=3.12"
dependencies = [
    "appliedin-core",
    "pyyaml>=6",
    "strands-agents>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appliedin_tailoring"]
