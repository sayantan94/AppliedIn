[project]
name = "appliedin"
version = "0.1.0"
description = "Autonomous job-application pipeline"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6",
    "google-adk>=2.5.0",
    "litellm>=1.92.0",
    "redis>=8.0.1",
    "mcp>=1.28.1",
    "sqlalchemy>=2.0.51",
    "browser-use>=0.5.9",
    "orjson>=3.11.9",
]

[project.optional-dependencies]
# Heavy runtime-only deps (installed in the worker container / when applying).
# Imported lazily so the rest runs without them.
runtime = [
    "google-api-python-client>=2",
    "google-auth>=2",
]

[project.scripts]
# `appliedin start|stop|status|discover|work|run|resume`. Resolves via the
# editable install (src/ on path); no force-include, so server.py keeps its
# repo-relative path to web/.
appliedin = "cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/discovery", "src/tools", "src/agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "moto[dynamodb,s3,sqs,secretsmanager]>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "fakeredis>=2.36.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# importlib mode lets same-named test files across components coexist.
addopts = "--import-mode=importlib"
consider_namespace_packages = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
