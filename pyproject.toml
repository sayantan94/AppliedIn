[project]
name = "appliedin"
version = "0.1.0"
description = "Autonomous job-application pipeline"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6",
    "strands-agents>=0.1",
]

[project.optional-dependencies]
# Heavy runtime-only deps, installed in the worker/tailoring containers.
# App code imports these lazily so the test suite runs without them.
runtime = [
    "playwright>=1.47",
    "google-api-python-client>=2",
    "google-auth>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One project, one src/, a subfolder (top-level import package) per component.
packages = [
    "src/core",
    "src/discovery",
    "src/tailoring",
    "src/worker",
    "src/dispatcher",
    "src/whatsapp",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "moto[dynamodb,s3,sqs,secretsmanager]>=5",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# importlib mode lets same-named test files across components coexist.
addopts = "--import-mode=importlib"
consider_namespace_packages = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
