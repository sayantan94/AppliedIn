# Watchlist — the 5-15 companies AppliedIn watches.
#
# THE SEED IS JUST THE CAREER-PAGE URL. The discovery resolver detects the ATS
# (greenhouse/lever/ashby/smartrecruiters/workday) from the URL — or by scanning
# the page for an embedded board — and derives the feed token automatically.
# Unrecognized career pages fall back to `discovery: crawl`.
#
# So a minimal entry is just name + careers_url. Set `ats`/`board` only to
# override detection.
#
#   mode:  auto | gated | assist   (new portals start gated, earn auto via burn-in)
#
# Replace these examples with the real watchlist (Next Steps #1 in hld/idea.md).
companies:
  - name: ExampleCorp
    careers_url: https://boards.greenhouse.io/examplecorp
    login_secret: portal/examplecorp
    mode: gated

  - name: LeverCo
    careers_url: https://jobs.lever.co/leverco
    login_secret: portal/leverco
    mode: gated

  - name: CustomPortalInc          # resolver finds no feed -> crawler + agentic apply
    careers_url: https://careers.customportal.com/openings
    login_secret: portal/customportal
    mode: gated
