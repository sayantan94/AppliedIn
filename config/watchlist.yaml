# Watchlist — the companies AppliedIn watches. The seed is the career-page URL;
# the finder resolves the ATS (or falls back to crawl for custom portals).
#   mode: auto | gated | assist   (new portals start gated, earn auto via burn-in)
companies:
  # Greenhouse feed — works out of the box (structured JSON, no browser needed).
#  - name: Stripe
#    careers_url: https://boards.greenhouse.io/stripe
#    login_secret: portal/stripe
#    mode: gated

  # Apple — custom JS portal, no public feed, so it's crawled + applied via the
  # browser. (Its search page renders jobs with JS, so the finder crawls it with
  # the browser MCP rather than a plain fetch.)
  - name: Apple
    careers_url: https://jobs.apple.com/en-us/search?location=united-states-USA
    ats: custom
    discovery: crawl
    login_secret: portal/apple
    mode: gated
