# What the discovery AGENT looks for. These are HINTS, not hardcoded rules — the
# stage-1 relevance agent (src/discovery/relevance.py) reads them as a brief and
# judges each posting's title, counting role variants (SDE, SWE, Backend /
# Platform / ML / AI Engineer, …) as fits. The deeper stage-2 LLM score
# (min_match_score) is the second, per-job gate.

# Target roles, in priority order — Senior first (the crawl searches these
# top-down, and the scorer weighs seniority fit). Hands-on software engineering
# (writes code), focused on AI / AI agents / LLM work.
titles:
  - Senior Software Engineer
  - Staff Software Engineer
  - Software Engineer

# Soft signals that RAISE fit (not required) — the AI/agents/LLM focus, plus
# platform / infrastructure engineering.
include_keywords:
  - ai
  - ai agents
  - agentic
  - agents
  - llm
  - large language model
  - generative ai
  - platform
  - infrastructure

seniority:
  - senior
  - staff

# Never a fit — technical-sounding NON-engineering roles that kept leaking
# through (management, support, solutions/sales, architects).
exclude_keywords:
  - intern
  - internship
  - new grad
  - security clearance
  - program manager
  - project manager
  - product manager
  - solutions architect
  - enterprise architect
  - support engineer
  - solutions engineer
  - sales engineer
  - customer engineer
  - android
  - ios
  - mobile

# REQUIRED location: Washington or California ONLY (on-site). US-remote is fine.
# The agent rejects postings clearly outside WA/CA; a blank/unknown is allowed.
locations:
  - Seattle
  - Bellevue
  - Washington
  - California
  - Remote (US)
remote_only: false

# Free-text HARD CONSTRAINTS — read by BOTH the title screen and the JD scorer.
# Anything violating these is rejected (scorer caps it at <=2). Add your own lines.
notes: |
  - No US security clearance: reject any role that REQUIRES an active or obtainable
    clearance (Secret, Top Secret, TS/SCI, Public Trust, polygraph). If clearance
    is not mentioned, it is fine.
  - Location preference is Washington or California (Seattle, Bellevue, SF Bay Area,
    LA). US-remote is fine. Reject a role ONLY if its location is CLEARLY a
    different US state or another country. An unstated / unclear / "multiple
    locations" listing is ACCEPTABLE — do not reject on a missing location.

# Stage-2: minimum LLM relevance score (0-10) for a job to proceed to apply.
min_match_score: 7

# Candidate's public GitHub — the tailor reads the repos (names, languages,
# topics) as extra context to reword bullets toward each JD.
github: https://github.com/sayantan94
