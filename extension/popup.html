<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><link rel="stylesheet" href="popup.css" /><title>AppliedIn</title></head>
  <body>
    <header class="hd">
      <img class="mark" src="icons/icon32.png" alt="" width="30" height="30" />
      <div>
        <div class="name">AppliedIn</div>
        <div class="sub" id="server">checking…</div>
      </div>
      <label class="sw" title="Open and fill handed-off applications automatically">
        <input type="checkbox" id="enabled" checked /><span></span>
      </label>
    </header>

    <section id="lead" class="lead">
      <div class="big" id="count">—</div>
      <div class="cap" id="cap">waiting on you</div>
    </section>

    <section id="list" class="list"></section>

    <section id="here" class="here" hidden>
      <button id="fill" class="go">Fill this one now</button>
    </section>

    <footer class="ft" id="ft"></footer>
    <script src="popup.js"></script>
  </body>
</html>
